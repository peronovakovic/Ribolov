spring:
  application:
    name: ribolov
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    url: ${DATABASE_URL}
    user: ${MIGRATION_USERNAME}
    password: ${MIGRATION_PASSWORD}
    default-schema: platform
    create-schemas: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
ribolov:
  web-url: ${WEB_URL}
  security:
    issuer: ${OIDC_ISSUER}
    web-client-secret: ${OIDC_WEB_SECRET}