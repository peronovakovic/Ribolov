spring:
  application:
    name: ribolov
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    url: ${DATABASE_URL}
    user: ${MIGRATION_USERNAME}
    password: ${MIGRATION_PASSWORD}
    default-schema: platform
    create-schemas: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
ribolov:
  web-url: ${WEB_URL}
  security:
    issuer: ${OIDC_ISSUER}
    web-client-secret: ${OIDC_WEB_SECRET}
  invitations:
    signing-key: ${INVITATION_SIGNING_KEY:}
    delivery-enabled: ${INVITATION_DELIVERY_ENABLED:false}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    from: ${SMTP_FROM:noreply@ribolov.local}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: ${SMTP_STARTTLS:true}
