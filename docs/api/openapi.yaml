components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Session:
      type: object
      required:
      - subject
      - displayName
      properties:
        subject:
          type: string
        displayName:
          type:
          - string
          - 'null'
    AccessContext:
      type: object
      required:
      - id
      - role
      - organization
      - validFrom
      - validUntil
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - SYSTEM_ADMIN
          - MINISTRY_ANALYST
          - FEDERATION_ANALYST
          - ASSOCIATION_ADMIN
          - OPERATOR
          - WARDEN
          - ANGLER
        organization:
          anyOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          - type: 'null'
        validFrom:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
    OrganizationSummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    OrganizationType:
      type: string
      enum:
      - MINISTRY
      - FEDERATION
      - ASSOCIATION
    Organization:
      type: object
      required:
      - id
      - version
      - name
      - type
      - status
      - contactEmail
      - contactPhone
      - parent
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 240
        type:
          $ref: '#/components/schemas/OrganizationType'
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        contactEmail:
          type:
          - string
          - 'null'
          maxLength: 254
        contactPhone:
          type:
          - string
          - 'null'
          maxLength: 50
        parent:
          anyOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          - type: 'null'
    OrganizationAffiliation:
      type: object
      required:
      - id
      - parent
      - validFrom
      - validUntil
      properties:
        id:
          type: string
          format: uuid
        parent:
          $ref: '#/components/schemas/OrganizationSummary'
        validFrom:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
    User:
      type: object
      required:
      - id
      - version
      - subject
      - displayName
      - active
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        subject:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 240
        active:
          type: boolean
    UserSummary:
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 240
    Role:
      type: string
      enum:
      - SYSTEM_ADMIN
      - MINISTRY_ANALYST
      - FEDERATION_ANALYST
      - ASSOCIATION_ADMIN
      - OPERATOR
      - WARDEN
      - ANGLER
    Assignment:
      type: object
      required:
      - id
      - version
      - user
      - organization
      - role
      - validFrom
      - validUntil
      - revokedAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        user:
          $ref: '#/components/schemas/UserSummary'
        organization:
          anyOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          - type: 'null'
        role:
          $ref: '#/components/schemas/Role'
        validFrom:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
    AdministrationEvent:
      type: object
      required:
      - id
      - occurredAt
      - action
      - actor
      - organization
      - targetUser
      - role
      - reason
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          enum:
          - BOOTSTRAP_ADMIN
          - ORGANIZATION_CREATED
          - ORGANIZATION_UPDATED
          - PARENT_CHANGED
          - USER_CONNECTED
          - USER_UPDATED
          - ROLE_GRANTED
          - ROLE_REVOKED
          - INVITATION_CREATED
          - INVITATION_REVOKED
          - INVITATION_RESENT
          - INVITATION_ACCEPTED
        actor:
          type: string
        organization:
          type:
          - string
          - 'null'
        targetUser:
          type:
          - string
          - 'null'
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obavezan stvarni razlog promjene; praznine nisu dovoljne.
    OrganizationPage:
      type: object
      required:
      - items
      - page
      - hasNext
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Organization'
        page:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
    UserPage:
      type: object
      required:
      - items
      - page
      - hasNext
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
    AssignmentPage:
      type: object
      required:
      - items
      - page
      - hasNext
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Assignment'
        page:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
    AdministrationEventPage:
      type: object
      required:
      - items
      - page
      - hasNext
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdministrationEvent'
        page:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
    CreateOrganization:
      type: object
      required:
      - name
      - type
      - reason
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 240
        type:
          $ref: '#/components/schemas/OrganizationType'
        contactEmail:
          type:
          - string
          - 'null'
          maxLength: 254
        contactPhone:
          type:
          - string
          - 'null'
          maxLength: 50
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obavezan stvarni razlog promjene; praznine nisu dovoljne.
      description: Ministarstvo nema roditelja; Savez zahtijeva Ministarstvo, udruženje Savez.
    UpdateOrganization:
      type: object
      required:
      - version
      - name
      - reason
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 240
        contactEmail:
          type:
          - string
          - 'null'
          maxLength: 254
        contactPhone:
          type:
          - string
          - 'null'
          maxLength: 50
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obavezan stvarni razlog promjene; praznine nisu dovoljne.
    ChangeParent:
      type: object
      required:
      - version
      - parentId
      - reason
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        parentId:
          type: string
          format: uuid
        effectiveFrom:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obavezan stvarni razlog promjene; praznine nisu dovoljne.
      description: Prazan effectiveFrom znači odmah; budući trenutak zakazuje promjenu. Retroaktivni datum nije
        dozvoljen.
    UpdateUser:
      type: object
      required:
      - version
      - displayName
      - active
      - reason
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        displayName:
          type: string
          minLength: 1
          maxLength: 240
        active:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obavezan stvarni razlog promjene; praznine nisu dovoljne.
    RevokeRole:
      type: object
      required:
      - version
      - reason
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obavezan stvarni razlog promjene; praznine nisu dovoljne.
    Problem:
      type: object
      required:
      - status
      - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        reauthenticate:
          type: boolean
    Invitation:
      type: object
      required:
      - id
      - version
      - email
      - role
      - organizationId
      - organization
      - createdAt
      - expiresAt
      - validUntil
      - status
      - sentAt
      - attempts
      - deliveryFailure
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        organizationId:
          type: string
          format: uuid
        organization:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REVOKED
          - EXPIRED
        sentAt:
          type:
          - string
          - 'null'
          format: date-time
        attempts:
          type: integer
          minimum: 0
        deliveryFailure:
          type:
          - string
          - 'null'
          enum:
          - DELIVERY_FAILED
          - null
    InvitationPage:
      type: object
      required:
      - items
      - page
      - hasNext
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Invitation'
        page:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
    CreateInvitation:
      type: object
      required:
      - email
      - role
      - organizationId
      - reason
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        organizationId:
          type: string
          format: uuid
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: Poziv važi 48 sati; validUntil mora biti kasniji od isteka poziva. SYS poziva analitičare/administratore;
        ADM operatera ili ribočuvara svog udruženja. Još ne dodjeljuje ulogu.
    ChangeInvitation:
      type: object
      required:
      - version
      - reason
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    InvitationToken:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 80
          maxLength: 80
          description: Tajna iz fragmenta primljene veze. Slati samo u tijelu POST zahtjeva, bez logovanja.
    InvitationPreview:
      type: object
      required:
      - role
      - organization
      - expiresAt
      - validUntil
      properties:
        role:
          $ref: '#/components/schemas/Role'
        organization:
          type: string
        expiresAt:
          type: string
          format: date-time
        validUntil:
          type:
          - string
          - 'null'
          format: date-time
    InvitationAccepted:
      type: object
      required:
      - assignmentId
      - role
      - organization
      properties:
        assignmentId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        organization:
          type: string
  parameters:
    AdminContext:
      name: X-Access-Context
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID vlastite trenutno važeće administrativne dodjele; ne ID organizacije.
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Token iz GET /api/v1/csrf; koristiti vraćeni headerName.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Search:
      name: search
      in: query
      schema:
        type: string
        default: ''
      description: Pretraga dijela naziva/imena, bez obzira na veličinu slova.
