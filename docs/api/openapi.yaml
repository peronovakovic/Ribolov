          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: Uspješno; DTO, bez keširanja
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Neispravan zahtjev
          content:
            application/problem+json:
              schema:
