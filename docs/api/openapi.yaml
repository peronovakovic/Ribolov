  /api/v1/access-contexts/{id}:
    get:
      operationId: getWebAccessContext
      security:
      - webSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Vlastito aktivno ovlaštenje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessContext'
        '400':
          description: Identifikator nije UUID
        '401':
          description: Prijava je potrebna
        '403':
          description: Tuđe, nepostojeće, opozvano ili isteklo ovlaštenje
  /api/v1/admin/organizations:
    get:
      operationId: listOrganizations
      summary: Pregled dostupnih organizacija
      security:
      - webSession: []
      parameters:
      - $ref: '#/components/parameters/AdminContext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Uspješno; DTO, bez keširanja
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          description: Neispravan zahtjev
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Prijava je potrebna
        '403':
          description: Nedozvoljen kontekst/radnja, CSRF ili MFA; reauthenticate=true traži novu prijavu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Zapis nije dostupan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Zastarjela verzija, preklapanje perioda ili sukob stanja
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: MFA acr=2 iz verifikovanog OIDC ID tokena. Samo zapisi u opsegu aktivno izabrane uloge.
    post:
