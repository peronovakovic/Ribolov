openapi: 3.1.0
info:
  title: Ribolov API
  version: 0.4.0
  description: Identitet, organizacije, administracija i jednokratni pozivi. Nove uloge se dodjeljuju tek prihvatanjem
    poziva uz potvrđenu e-poštu i svježi MFA.
servers:
- url: http://localhost:8080
paths:
  /api/v1/session:
    get:
      operationId: getWebSession
      security:
      - webSession: []
      responses:
        '200':
          description: Prijavljeni korisnik bez poslovnih ovlaštenja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Prijava je potrebna
  /api/mobile/v1/session:
    get:
      operationId: getMobileSession
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Identitet potvrđen bearer tokenom
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Token nedostaje ili nije prihvatljiv
  /api/v1/csrf:
    get:
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token za serversku sesiju
          content:
            application/json:
              schema:
                type: object
                required:
                - parameterName
                - headerName
                - token
                properties:
                  parameterName:
                    type: string
                  token:
                    type: string
                  headerName:
                    type: string
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Proces je aktivan
        '503':
          description: Proces nije spreman za rad
  /api/v1/access-contexts:
    get:
      operationId: getWebAccessContexts
      security:
      - webSession: []
      responses:
        '200':
          description: Samo vlastita aktivna ovlaštenja; nepoznat nalog dobija praznu listu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessContext'
        '401':
          description: Prijava je potrebna
        '403':
          description: Verifikovani identitet nedostaje
  /api/mobile/v1/access-contexts:
    get:
      operationId: getMobileAccessContexts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Samo vlastita aktivna ovlaštenja; nepoznat nalog dobija praznu listu
          content:
            application/json:
              schema:
                type: array
                items:
